<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Routing Simulator</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <canvas id="bg"></canvas>
    <canvas id="main"></canvas>
    <div id="side-panel">
        <span id="mouse" class="active" title="Select/Move Node (Click or Drag)"><svg class="w-5 h-5" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122">
                </path>
            </svg></span>
        <span id="client" title="Add a Client PC (Click canvas to place)"><svg class="w-5 h-5 text-sky-400" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                </path>
            </svg></span>
        <span id="router" title="Add a Router (Click canvas to place)"> <svg xmlns="http://www.w3.org/2000/svg"
                width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-router" data-d-component="icon">
                <rect width="20" height="8" x="2" y="14" rx="2"></rect>
                <path d="M6.01 18H6"></path>
                <path d="M10.01 18H10"></path>
                <path d="M15 10v4"></path>
                <path d="M17.84 7.17a4 4 0 0 0-5.66 0"></path>
                <path d="M20.66 4.34a8 8 0 0 0-11.31 0"></path>
            </svg></span>
        <span id="link" title="Make Connections between 2 Nodes"><svg class="w-5 h-5 text-slate-300" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1">
                </path>
            </svg></span>
        <span id="delete" title="Delete a Node (Click to Delete)"><svg class="w-5 h-5 text-slate-400 hover:text-red-400"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                </path>
            </svg></span>
            <div class="line"></div>
        <span id="upload" title="Upload Config"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                height="24px" width="24px" fill="#fff">
                <path
                    d="M11,16V7.85l-2.6,2.6L7,9l5-5l5,5l-1.4,1.45L13,7.85V16H11ZM6,20q-0.82,0-1.41-0.59T4,18V15H6v3H18V15h2v3q0,0.82-0.59,1.41T18,20H6Z" />
            </svg></span>
        <span id="download" title="Save current Config"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                height="24px" width="24px" fill="#fff">
                <path
                    d="M12,16L7,11L8.4,9.55l2.6,2.6V4h2v8.15l2.6-2.6L17,11l-5,5ZM6,20q-0.82,0-1.41-0.59T4,18V15H6v3H18V15h2v3q0,0.82-0.59,1.41T18,20H6Z" />
            </svg></span>
    </div>
    <div id="detail"></div>
    <span id="help-btn">?</span>
</body>

</html>
